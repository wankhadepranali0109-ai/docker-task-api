<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #1f2937;
    }

    main {
      width: 100%;
      max-width: 650px;
      background: #ffffff;
      padding: 32px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.10);
    }

    h1 {
      margin-top: 0;
      color: #1d4ed8;
    }

    .subtitle {
      color: #64748b;
    }

    form {
      display: flex;
      gap: 10px;
      margin: 24px 0;
    }

    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      color: white;
      background: #1d4ed8;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      background: #1e40af;
    }

    ul {
      padding: 0;
      list-style: none;
    }

    li {
      margin: 10px 0;
      padding: 12px;
      border-radius: 8px;
      background: #eff6ff;
    }

    #message {
      min-height: 20px;
      color: #b91c1c;
    }
  </style>
</head>

<body>
  <main>
    <h1>Task Manager</h1>
    <p class="subtitle">Flask, PostgreSQL, Docker and Kubernetes learning project.</p>

    <form id="task-form">
      <input id="task-title" type="text" placeholder="Enter a task" required />
      <button type="submit">Add task</button>
    </form>

    <p id="message"></p>

    <h2>Tasks</h2>
    <ul id="task-list"></ul>
  </main>

  <script>
    const taskForm = document.getElementById("task-form");
    const taskTitle = document.getElementById("task-title");
    const taskList = document.getElementById("task-list");
    const message = document.getElementById("message");

    async function loadTasks() {
      message.textContent = "";

      try {
        const response = await fetch("/tasks");

        if (!response.ok) {
          throw new Error("Could not load tasks.");
        }

        const tasks = await response.json();
        taskList.innerHTML = "";

        if (tasks.length === 0) {
          taskList.innerHTML = "<li>No tasks yet.</li>";
          return;
        }

        tasks.forEach((task) => {
          const item = document.createElement("li");
          item.textContent = `#${task.id} - ${task.title}`;
          taskList.appendChild(item);
        });
      } catch (error) {
        message.textContent = error.message;
      }
    }

    taskForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";

      try {
        const response = await fetch("/tasks", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            title: taskTitle.value
          })
        });

        if (!response.ok) {
          throw new Error("Could not create task.");
        }

        taskTitle.value = "";
        await loadTasks();
      } catch (error) {
        message.textContent = error.message;
      }
    });

    loadTasks();
  </script>
</body>
</html>
